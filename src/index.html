<!DOCTYPE html>
<meta charset=utf-8>
<body style="margin: 0;background:#000;color:#fff;font:16px monospace;">
    <pre id=o style="margin:0;"></pre>
    <span>[Kibblix@TinyBox!]$ </span><input id=i autofocus style="background:#000;color:#fff;border:0;outline:0;font:inherit;">
    <script>
        f_ ='_____    ____\n|   |   /   /     |  kernel: 7.2.8-1-TinyOS\n|   |  /   /      |  shell: ksh\n|   | /   /       |  mem: 3.0KB / 3KB\n|   |/   /        |  pkgs: 0\n|   |___/         |  user: Kibblix\n|   |___\\         |  host: TinyBox!\n|   |\\   \\        |  distro: TinyOS\n|   | \\   \\       |  ################\n|___|  \\___\\      |  ################'
        d_ ='[Kibblix@TinyBox!]$ '
        o_='',t_=''
        c_=['echo','id','kfetch','ls','lsblk','pwd','nmctl']
        r_=["","uid=1000 (Kibblix) gid=1000(Kibblix)",f_,"/tmp/Kibblix/sh:\nbin/","NAME           USED  AVAIL  MOUNT\ntmpfs\n |- tmpfs_1    3.0KB 0.3%    /tmp/Kibblix/sh/","pwd: /tmp/Kibblix/sh/","systemctl: networkmanager.service not found or broken\nupdate the package: tinypac nmctl"]
        o.textContent=f_+"\n"

        ac=new AudioContext

        function beep(freq,time){
            let x=ac.createOscillator()
            let g=ac.createGain()

            x.frequency.value=freq
            g.gain.value=.08

            x.connect(g)
            g.connect(ac.destination)

            x.start()
            x.stop(ac.currentTime+time)
        }



        i.onkeydown=e=>{
            if(e.key=="Enter"){
                t_=i.value.trim()
                o_=''
                n=c_.indexOf(t_)
                
                
                
                if(t_=="help"){
                    o_=c_.join("\n")+"\ntinypac\nclear\nshutdown"
                }else if(t_==''){
                    o.textContent+=d_+"\n"
                    return
                }else if(t_=="clear"){
                    o.textContent='' 
                    i.value=''
                    return 
                }else if(t_.startsWith("tinypac ")){
                    let a=t_.slice(8)
                    o_="couldn't find/install package: '"+a+"' because a network connection was not found\nuse the nmctl tool to get connected"
                }else if(t_.startsWith("echo ")){
                    o_=t_.slice(5)   
                }else if(t_.startsWith("ls ")){
                    let a=t_.slice(3)
                    
                    if(a=="bin"||a=="./bin"||a=="/tmp/Kibblix/sh/bin"){
                        o_=c_.join("\n")+"\ntinypac\nclear\nshutdown"
                    }else if(a=="/tmp/Kibblix/sh"){
                        o_="/tmp/Kibblix/sh:\nbin/"
                    }else{
                        o_="ls: cannot open \'"+a+"\' Permission denied"
                    }
                }else if(t_=="sudo rm -rf /"){
                    o_=""
                    beep(700,.08)

                    setTimeout(()=>beep(700,.08),150)

                    setTimeout(()=>beep(180,999),300)
                    setTimeout(() => {
                        document.body.style.background="blue"
                        document.body.innerHTML="<pre>\nKernel panic\n\nTinyOS ran into a problem, please reboot your computer now</pre>\nError code: I4MSTUP1D"
                    }, 1000);
                }else if(t_=="shutdown"){
                    s=(x,t)=>setTimeout(()=>o.textContent+=x+"\n",t)
                    s("started system.target poweroff",0)
                    s("stopping services",100)
                    s("tinyd is running a stop job",400)
                    s("wiping tmpfs",600)
                    s("system.target poweroff reached after 1100ms",1000)

                    setTimeout(()=>{
                        document.body.innerHTML=""
                    },2000)

                }else if(n>=0){
                    o_=r_[n]   
                }else{
                    o_='ksh: Unknown or incomplete command: '+t_+'\nType help for a list of valid commands'
                    beep(300, 0.1)
                }
                o.textContent+=d_+t_+"\n"+o_+"\n"
                i.value=""
            }
        }
    </script>
</body>
